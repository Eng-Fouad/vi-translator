<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 80s Miami dusk -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d0f45"/>
      <stop offset="0.45" stop-color="#6a1b78"/>
      <stop offset="0.75" stop-color="#e0306f"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff4f8b"/>
    </linearGradient>
    <linearGradient id="vi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#ffe3f1"/>
      <stop offset="1" stop-color="#ff9ccf"/>
    </linearGradient>
    <clipPath id="tile"><rect x="16" y="16" width="480" height="480" rx="112"/></clipPath>
    <clipPath id="sunStripes">
      <rect x="0" y="0" width="512" height="330"/>
      <rect x="0" y="338" width="512" height="12"/>
      <rect x="0" y="358" width="512" height="9"/>
      <rect x="0" y="375" width="512" height="6"/>
      <rect x="0" y="389" width="512" height="4"/>
    </clipPath>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#12062a" flood-opacity="0.55"/>
    </filter>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="16" y="16" width="480" height="480" fill="url(#sky)"/>
    <!-- striped sun on the horizon -->
    <circle cx="256" cy="370" r="132" fill="url(#sun)" clip-path="url(#sunStripes)"/>
    <!-- palm silhouette, bottom right -->
    <g fill="#160a2e">
      <path d="M430 520 C428 450 420 400 404 350 L414 348 C432 400 440 450 444 520 Z"/>
      <path d="M408 352 C380 330 344 330 318 344 C350 338 380 344 404 360 Z"/>
      <path d="M408 352 C392 318 360 300 330 300 C362 312 386 330 402 358 Z"/>
      <path d="M410 350 C420 318 446 300 478 300 C452 312 432 330 416 356 Z"/>
      <path d="M412 352 C446 336 482 342 506 362 C478 352 446 352 418 362 Z"/>
      <path d="M408 350 C404 316 412 288 432 270 C420 296 416 322 414 352 Z"/>
    </g>
  </g>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4"/>
  <!-- speech bubble: A → ع -->
  <path d="M108 52 H404 A48 48 0 0 1 452 100 V196 A48 48 0 0 1 404 244 H384 L392 292 L336 244 H108 A48 48 0 0 1 60 196 V100 A48 48 0 0 1 108 52 Z" fill="#120a26" stroke="#ffcf5a" stroke-opacity="0.35" stroke-width="3"/>
  <g transform="translate(156 196) skewX(-10)"><text x="0" y="0" text-anchor="middle" font-family="Bahnschrift" font-weight="700" font-stretch="condensed" font-size="150" fill="#ffffff">A</text></g>
  <path d="M222 152 H270 M254 134 L274 152 L254 170" fill="none" stroke="#ffcf5a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="352" y="170" text-anchor="middle" font-family="Aldhabi" font-weight="400" font-size="190" fill="#ffcf5a" stroke="#ffcf5a" stroke-width="3">ع</text>
  <!-- VI -->
  <g transform="translate(256 452) skewX(-10)">
    <text x="0" y="0" text-anchor="middle" font-family="Bahnschrift" font-weight="700" font-stretch="condensed" font-size="190" letter-spacing="2"
      fill="#ff2e9a" filter="url(#glow)">VI</text>
    <text x="0" y="0" text-anchor="middle" font-family="Bahnschrift" font-weight="700" font-stretch="condensed" font-size="190" letter-spacing="2" fill="url(#vi)" stroke="#ff5fb4" stroke-width="3">VI</text>
  </g>
</svg>
