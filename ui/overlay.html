<!doctype html>
<html lang="ar">
  <head>
    <meta charset="utf-8" />
    <title>VI Translator overlay</title>
    <link rel="stylesheet" href="fonts.css" />
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
      #wrap { position: fixed; inset: 0; }
    </style>
  </head>
  <body>
    <div id="wrap"><div id="box"></div></div>
    <script src="common.js"></script>
    <script>
      const { invoke } = window.__TAURI__.core;
      const { listen } = window.__TAURI__.event;
      const AREA = window.__AREA__;
      const wrap = document.getElementById("wrap");
      const box = document.getElementById("box");
      let cfg = null;
      let segments = [];
      let lineH = 0; // English line height (fraction of the frame) for size matching
      let textBox = null; // English text block [x, y, w, h] (fractions of the frame)
      let geom = { placement: "above", client_h: 1080 };

      // The "__screen" window covers the whole game and draws profile pages (GTA V "Mission Failed").
      const SCREEN = AREA === "__screen";
      let layout = null;

      function draw() {
        if (!cfg) return;
        if (SCREEN) {
          AS.renderScreen(wrap, layout, segments, cfg.profile_opts);
          return;
        }
        const area = cfg.areas.find((a) => a.id === AREA);
        if (!area) return;
        AS.anchor(wrap, area.placement, area);
        // style sizes are for a 1080p window; the overlay window is sized in physical pixels
        const k = geom.client_h / 1080 / window.devicePixelRatio;
        const px = AS.matchedPx(area, lineH, geom.client_h / window.devicePixelRatio);
        AS.renderBox(box, segments, AS.styleOf(area, cfg.style), k, area.font_scale, area.placement, area, px);
        if (area.placement === "under_text") {
          const dpr = window.devicePixelRatio;
          const W = (geom.client_w || 0) / dpr, H = geom.client_h / dpr;
          if (textBox && W) {
            AS.placeUnderText(box, textBox, lineH, W, H, (geom.win_x || 0) / dpr, (geom.win_y || 0) / dpr);
          } else {
            Object.assign(box.style, { position: "absolute", left: "0", top: `${area.h * H}px`, margin: "0" });
          }
        }
      }

      invoke("get_config").then((c) => { cfg = c; AS.setLang(c.target_lang); draw(); });
      listen("config", (e) => { cfg = e.payload; AS.setLang(cfg.target_lang); draw(); });
      listen("geom", (e) => { geom = e.payload; draw(); });
      window.addEventListener("resize", draw);
      // fonts load asynchronously; redraw once they are ready so sizes are measured with the right font
      document.fonts.ready.then(draw);
      if (SCREEN) {
        invoke("get_screen").then((s) => { layout = s.layout; segments = s.reason || []; draw(); });
        listen("screen", (e) => { layout = e.payload; if (!layout) segments = []; draw(); });
      }
      const MY_TEXT = SCREEN ? "__screen_reason" : AREA;
      listen("translation", (e) => {
        if (e.payload.area !== MY_TEXT || e.payload.error) return;
        segments = e.payload.segments;
        if (e.payload.line_h) lineH = e.payload.line_h;
        if (e.payload.text_box) textBox = e.payload.text_box;
        draw();
      });
    </script>
  </body>
</html>
